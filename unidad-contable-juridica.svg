<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Contrato firmado, factura y resguardo documental">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F6F4"/>
      <stop offset="1" stop-color="#EFE7E1"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1F1F1F" flood-opacity="0.13"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#fondo)"/>

  <!-- Factura, al fondo -->
  <g transform="rotate(-7 300 320)" filter="url(#sombra)">
    <rect x="130" y="150" width="270" height="350" rx="10" fill="#FFFFFF"/>
    <rect x="130" y="150" width="270" height="8" rx="4" fill="#C9A96E"/>
    <rect x="158" y="192" width="92" height="9" rx="4.5" fill="#1F1F1F"/>
    <rect x="158" y="214" width="150" height="7" rx="3.5" fill="#EFE7E1"/>
    <g fill="#EFE7E1">
      <rect x="158" y="258" width="214" height="7" rx="3.5"/>
      <rect x="158" y="282" width="214" height="7" rx="3.5"/>
      <rect x="158" y="306" width="214" height="7" rx="3.5"/>
      <rect x="158" y="330" width="160" height="7" rx="3.5"/>
    </g>
    <rect x="158" y="252" width="60" height="7" rx="3.5" fill="#6D6D6D" opacity="0.45"/>
    <rect x="158" y="372" width="214" height="2" fill="#EFE7E1"/>
    <rect x="158" y="392" width="76" height="12" rx="6" fill="#1F1F1F"/>
    <rect x="286" y="392" width="86" height="12" rx="6" fill="#F65C7A"/>
    <rect x="158" y="432" width="120" height="7" rx="3.5" fill="#EFE7E1"/>
  </g>

  <!-- Contrato, al frente -->
  <g transform="rotate(4 500 300)" filter="url(#sombra)">
    <rect x="360" y="100" width="310" height="400" rx="12" fill="#FFFFFF"/>
    <rect x="392" y="140" width="128" height="11" rx="5.5" fill="#1F1F1F"/>
    <rect x="392" y="164" width="72" height="7" rx="3.5" fill="#C9A96E"/>
    <g fill="#EFE7E1">
      <rect x="392" y="206" width="246" height="7" rx="3.5"/>
      <rect x="392" y="228" width="246" height="7" rx="3.5"/>
      <rect x="392" y="250" width="200" height="7" rx="3.5"/>
      <rect x="392" y="288" width="246" height="7" rx="3.5"/>
      <rect x="392" y="310" width="246" height="7" rx="3.5"/>
      <rect x="392" y="332" width="178" height="7" rx="3.5"/>
    </g>
    <!-- Clausulas marcadas -->
    <rect x="378" y="203" width="4" height="56" rx="2" fill="#F65C7A"/>
    <rect x="378" y="285" width="4" height="56" rx="2" fill="#C9A96E"/>

    <!-- Linea y firma -->
    <rect x="392" y="412" width="180" height="2" fill="#1F1F1F" opacity="0.35"/>
    <path d="M400 406c14-20 22 6 34-10 10-13 16 12 28 2 9-7 14 10 24 0 8-8 13 9 22 1"
          fill="none" stroke="#F65C7A" stroke-width="3.4" stroke-linecap="round"/>
    <rect x="392" y="428" width="96" height="6" rx="3" fill="#EFE7E1"/>

    <!-- Sello -->
    <circle cx="614" cy="406" r="40" fill="none" stroke="#C9A96E" stroke-width="3"/>
    <circle cx="614" cy="406" r="31" fill="none" stroke="#C9A96E" stroke-width="1.5" opacity="0.6"/>
    <path d="M600 406l10 11 20-23" fill="none" stroke="#C9A96E" stroke-width="4.5"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
